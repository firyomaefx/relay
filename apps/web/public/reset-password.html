<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Choose a new Relay Cloud password." />
  <meta name="robots" content="noindex" />
  <title>Reset password · Relay Cloud</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="stylesheet" href="/styles.css" />
  <script src="/setup.js" defer></script>
</head>
<body class="auth-page" data-invite-mode="reset">
  <main class="auth-shell">
    <div class="auth-brand"><img src="/brand/relay-cloud-lockup-dark.png" alt="Relay Cloud"></div>
    <div class="bezel auth-card">
      <section class="panel">
        <h1 class="auth-title" id="setupTitle">Choose a new password</h1>
        <p class="auth-lede" id="setupLede">Use at least 10 characters. This link expires in 24 hours.</p>
        <form class="auth-form" id="setupForm" novalidate>
          <div>
            <label class="auth-label" for="password">New password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required autofocus />
          </div>
          <div style="margin-top:12px">
            <label class="auth-label" for="confirm">Confirm password</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required />
          </div>
          <p class="auth-error" id="setupError" role="alert" hidden></p>
          <button class="primary-btn" id="setupBtn" type="submit"><span id="setupLabel">Update password</span></button>
        </form>
      </section>
    </div>
    <div class="auth-links"><a href="/">← Relay Cloud</a><a href="/login">Sign in</a></div>
  </main>
</body>
</html>
