<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Reset your Relay Cloud password." />
  <meta name="robots" content="noindex" />
  <title>Forgot password · Relay Cloud</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="/customer-forgot.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand"><img src="/brand/relay-cloud-lockup-dark.png" alt="Relay Cloud"></div>
    <div class="bezel auth-card">
      <section class="panel">
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-lede">Enter your account email. If it is on file, we will send a link to choose a new password. We never email a generated password.</p>
        <form class="auth-form" id="forgotForm" novalidate>
          <div>
            <label class="auth-label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus />
          </div>
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAGApt-I6nXwVv73D" data-theme="light" data-size="flexible"></div>
          <p class="auth-error" id="forgotError" role="alert" hidden></p>
          <p class="auth-lede" id="forgotSuccess" hidden role="status"></p>
          <button class="primary-btn" id="forgotBtn" type="submit"><span id="forgotLabel">Email me a link</span></button>
        </form>
      </section>
    </div>
    <div class="auth-links"><a href="/login">← Back to sign in</a></div>
  </main>
</body>
</html>
