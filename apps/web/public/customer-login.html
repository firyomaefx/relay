<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Relay Cloud customer sign in." />
  <meta name="robots" content="noindex" />
  <title>Log in · Relay Cloud</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="/customer-login.js?v=20261115turnstile" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand"><img src="/brand/relay-cloud-lockup-dark.png" alt="Relay Cloud"></div>
    <div class="bezel auth-card">
      <section class="panel">
        <h1 class="auth-title">Customer sign in</h1>
        <p class="auth-lede">Use the email and password from your Relay Cloud setup email.</p>
        <form class="auth-form" id="customerLoginForm" novalidate>
          <div>
            <label class="auth-label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus />
          </div>
          <div style="margin-top:12px">
            <label class="auth-label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAGApt-I6nXwVv73D" data-theme="light" data-size="flexible"></div>
          <p class="auth-error" id="customerLoginError" role="alert" hidden></p>
          <button class="primary-btn" id="customerLoginBtn" type="submit"><span id="customerLoginLabel">Continue</span></button>
        </form>
        <p class="auth-lede" style="margin-top:16px"><a href="/forgot-password">Forgot password?</a> · Need access? <a href="/waitlist">Join the waitlist</a>.</p>
      </section>
    </div>
    <div class="auth-links">
      <a href="/">← Relay Cloud</a>
      <a href="/admin">Owner sign in</a>
    </div>
  </main>
</body>
</html>
