<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Relay console sign in." />
  <meta name="robots" content="noindex" />
  <title>Operator sign in · Relay Cloud</title>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta property="og:site_name" content="Relay Cloud">
<meta property="og:image" content="https://relay.duitpoket.fun/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://relay.duitpoket.fun/og.png">

  <link rel="stylesheet" href="/styles.css" />
  <script src="/login.js" defer></script>
  <style>
  .auth-back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:#5f6b63;font-size:13px;text-decoration:none}
  .auth-back:hover{color:#18211c}
  </style>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="/brand/relay-cloud-lockup-dark.png" alt="Relay Cloud">
    </div>

    <div class="bezel auth-card">
      <section class="panel">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-lede">Operator console. Enter the console password.</p>

        <form class="auth-form" id="loginForm" novalidate>
          <div>
            <label class="auth-label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required autofocus />
          </div>
          <p class="auth-error" id="loginError" role="alert" hidden></p>
          <button class="primary-btn" id="loginBtn" type="submit">
            <span id="loginLabel">Continue</span>
          </button>
        </form>
      </section>
    </div>
    <div class="auth-links">
      <a href="/">← Relay Cloud</a>
      <a href="/login">Customer sign in</a>
    </div>
  </main>
</body>
</html>
