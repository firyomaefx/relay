# Runs on the relay-prod VM after you register a GitHub Actions self-hosted runner
# with labels: self-hosted, relay-prod (see deploy/DEPLOY.md).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, relay-prod]
    steps:
      - name: Pull, build, restart
        run: sudo DEPLOY_STRICT_SLEEP_VERIFY=1 DEPLOY_STRICT_PUBLIC_SLEEP_VERIFY=0 -u relay bash /opt/relay/deploy/deploy.sh
      - name: Sleep mode verify (localhost then public)
        working-directory: /opt/relay
        env:
          RELAY_PUBLIC_URL: https://relay.duitpoket.fun
          RELAY_CLOUD_MCP_URL: https://cloud-mcp.duitpoket.fun
        run: |
          node tools/verify-sleep-mode-local.mjs
          node tools/verify-sleep-mode.mjs