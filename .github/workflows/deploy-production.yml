# Runs on the relay-prod VM after you register a GitHub Actions self-hosted runner
# with labels: self-hosted, relay-prod (see deploy/DEPLOY.md).
# Note: pushes on Origin (ttrg/relay) do not trigger GitHub Actions unless this repo
# is mirrored on GitHub or you use workflow_dispatch from a GitHub remote.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_public:
        description: Require public sleep-mode URLs (cloud-mcp on 4321)
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: [self-hosted, relay-prod]
    steps:
      - name: System ready (pull, tunnel gate, deploy, go-live, verify)
        env:
          DEPLOY_STRICT_PUBLIC_SLEEP_VERIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.strict_public && '1' || '0') || '1' }}
        run: sudo bash /opt/relay/deploy/vm-system-ready.sh